<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Rate Nürburg Guide</title>
    <link rel="canonical" href="https://nuerburgguide.de/rate/">
    <link rel="stylesheet" href="/styles.css?v=20260904-02">
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon-v2.svg?v=20260915-03">
    <style>
        .rate-page {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px 16px;
        }
        .rate-card {
            width: 100%;
            max-width: 480px;
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid var(--color-border-soft);
            border-radius: var(--radius-card);
            background: var(--color-surface);
            box-shadow: var(--shadow-card);
            text-align: center;
        }
        .rate-card h1 {
            margin: 0 0 var(--space-title-copy);
            font-size: var(--type-section-title);
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: 0;
            overflow-wrap: anywhere;
        }
        .rate-card p {
            margin: 0 0 28px;
            color: var(--color-muted);
            font-size: var(--type-body);
            line-height: 1.72;
        }
        .rate-actions {
            display: grid;
            gap: 14px;
        }
        .rate-actions .button {
            width: 100%;
            min-height: 56px;
            padding: 16px;
            font-size: 1rem;
            line-height: 1.4;
        }
        @media (prefers-reduced-motion: reduce) {
            .rate-actions .button { transition: none; transform: none; }
        }
    </style>
</head>
<body>
    <main class="rate-page">
        <div class="rate-card">
            <h1>Rate Nürburg Guide</h1>
            <p>Your rating really helps us grow. Thank you for your support!</p>
            <div class="rate-actions">
                <a class="button" href="https://apps.apple.com/app/id6769304414">Rate on the App Store</a>
                <a class="button button-secondary" href="https://play.google.com/store/apps/details?id=de.nuerburgguide.app">Rate on Google Play</a>
            </div>
        </div>
    </main>
</body>
</html>
